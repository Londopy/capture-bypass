[package]
name = "gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "capture_bypass"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
injector_core = { path = "../core" }

[dependencies.windows]
version = "0.58"
features = [
    # Only the features gui/src/main.rs itself needs (window enumeration).
    # Injection-specific features live in injector_core.
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winres = "0.1"
