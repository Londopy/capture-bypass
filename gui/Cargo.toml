[package]
name = "gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "capture_bypass_gui"
path = "src/main.rs"

[dependencies]
eframe        = { version = "0.31", default-features = true }
egui_extras   = { version = "0.31" }
injector_core = { path = "../core" }
tray-icon     = { version = "0.19", features = ["common-controls-v6"] }
winreg        = "0.52"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
toml          = "0.8"
ureq          = { version = "2", features = ["json"] }
dirs-next     = "2"
open          = "5"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
]

[build-dependencies]
winres = "0.1"
