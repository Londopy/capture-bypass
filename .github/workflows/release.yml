name: Release

# Triggers whenever you push a version tag — e.g. git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - 'v*'

# Needed so the job can create a GitHub Release and upload assets
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Rust toolchain (x64 + x86) ───────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc

      # ── 3. Cache compiled deps ───────────────────────────────────────────────
      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── 4. Build x64 (GUI + CLI + stress tester + both payload DLLs) ─────────
      - name: Build x64
        shell: pwsh
        run: |
          $env:APP_VERSION = "${{ github.ref_name }}".TrimStart('v')
          cargo build --release `
            -p payload_dll `
            -p payload_dll_persistent `
            -p cli `
            -p gui `
            -p stress_tester

      # ── 5. Build x86 (CLI + payload DLLs only — no GUI needed) ──────────────
      - name: Build x86
        run: |
          cargo build --release --target i686-pc-windows-msvc `
            -p payload_dll `
            -p payload_dll_persistent `
            -p cli

      # ── 6. Build Windows installer with Inno Setup ──────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            installer\capture-bypass.iss

      # ── 7. Compute SHA-256 checksum & write release body prefix ────────────
      - name: Compute checksum
        shell: pwsh
        run: |
          $version  = "${{ github.ref_name }}".TrimStart('v')
          $filename = "capture-bypass-setup-$version-x64.exe"
          $hash     = (Get-FileHash "dist\$filename" -Algorithm SHA256).Hash

          # SHA256SUMS.txt — attached as a release asset
          "$hash  $filename" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding utf8NoBOM

          # release-body.txt — prepended to the auto-generated release notes
          @"
          ## Verify before running
          ``````powershell
          Get-FileHash .\$filename -Algorithm SHA256
          ``````
          **Expected SHA-256:** ``$hash``

          ---
          "@ -replace '^ {10}', '' | Out-File -FilePath dist\release-body.txt -Encoding utf8NoBOM

      # ── 8. Create GitHub Release & attach installer + checksum ───────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true   # auto-fills body from commit messages
          body_path: dist/release-body.txt
          files: |
            dist/capture-bypass-setup-*-x64.exe
            dist/SHA256SUMS.txt
