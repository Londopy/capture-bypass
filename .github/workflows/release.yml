name: Release

# Triggers whenever you push a version tag — e.g. git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - 'v*'

# Needed so the job can create a GitHub Release and upload assets
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Rust toolchain (x64 + x86) ───────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc

      # ── 3. Cache compiled deps ───────────────────────────────────────────────
      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── 4. Build x64 (GUI + CLI + stress tester + both payload DLLs) ─────────
      - name: Build x64
        run: |
          cargo build --release `
            -p payload_dll `
            -p payload_dll_persistent `
            -p cli `
            -p gui `
            -p stress_tester

      # ── 5. Build x86 (CLI + payload DLLs only — no GUI needed) ──────────────
      - name: Build x86
        run: |
          cargo build --release --target i686-pc-windows-msvc `
            -p payload_dll `
            -p payload_dll_persistent `
            -p cli

      # ── 6. Package: standalone Rust GUI bundle ───────────────────────────────
      #   x86 payload DLLs land in x86\ so the GUI finds them automatically.
      - name: Package GUI bundle
        shell: pwsh
        run: |
          $out = "dist\gui"
          New-Item -ItemType Directory -Path $out       -Force | Out-Null
          New-Item -ItemType Directory -Path "$out\x86" -Force | Out-Null

          Copy-Item "target\release\capture_bypass_gui.exe"     "$out\"
          Copy-Item "target\release\stress_tester.exe"          "$out\"
          Copy-Item "target\release\payload_dll.dll"            "$out\"
          Copy-Item "target\release\payload_dll_persistent.dll" "$out\"

          Copy-Item "target\i686-pc-windows-msvc\release\payload_dll.dll"             "$out\x86\"
          Copy-Item "target\i686-pc-windows-msvc\release\payload_dll_persistent.dll"  "$out\x86\"

          Compress-Archive -Path "$out\*" `
            -DestinationPath "capture-bypass-gui-${{ github.ref_name }}-x64.zip"

      # ── 7. Build Windows installer with Inno Setup ──────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            installer\capture-bypass.iss

      # ── 9. Create GitHub Release & attach all assets ─────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true   # auto-fills body from commit messages
          files: |
            capture-bypass-gui-${{ github.ref_name }}-x64.zip
            dist/capture-bypass-setup-*-x64.exe
